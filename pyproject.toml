[tool.poetry]
name = "led-matrix-display"
version = "0.2.0"
description = "Multi-module LED matrix display with flight tracking and SEPTA subway arrivals"
authors = ["Dillon Butler"]
readme = "README.md"
packages = [{include = "modules"}]

[tool.poetry.dependencies]
python = "^3.14"
requests = "^2.31.0"
python-dotenv = "^1.0.0"
beautifulsoup4 = "^4.14.3"
lxml = "^6.0.2"
rgbmatrixemulator = "^0.15.1"
pillow = "^12.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^24.0.0"
isort = "^5.13.0"

[tool.poetry.scripts]
led-display = "main:main"
overhead-flights = "modules.overhead_flights:main"
septa-transit = "modules.septa_transit:main"

[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
